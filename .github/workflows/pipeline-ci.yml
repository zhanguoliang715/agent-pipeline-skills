name: pipeline-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    # 锁 22.04：ubuntu-latest 已升到 26.04，setup-python 在它上面没有 3.9 的构建，
    # 会让最低支持版本这一腿永远跑不起来（2026-11-03 实测报 "Version 3.9 was not found"）。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install security scanner dependency
        # bandit 1.9.4 的 Requires-Python 是 >=3.10，3.9 装不上。
        # 核心八棒脚本是零依赖的，3.9 只跳过可选深度扫描（回归用例会自动跳过 bandit 相关断言）。
        if: matrix.python != '3.9'
        run: pip install "bandit==1.9.4"

      - name: Syntax gate (must parse on the target interpreter)
        run: python -m compileall -q . -x '/(\.git|node_modules)/'

      - name: Structure & doc consistency (validate_pipeline)
        run: python validate_pipeline.py

      - name: Behavior contract regression (78 cases)
        run: python scripts/regression_test.py

      - name: End-to-end smoke (nine-gate chain + reject/fix routing)
        run: python scripts/smoke_pipeline.py
